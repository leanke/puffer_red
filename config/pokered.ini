[base]
package = pokered
env_name = pokered
policy_name = PokemonRed
rnn_name = PokemonRedLSTM

[vec]
num_envs = 6
batch_size = auto

[policy]
capture_viz = False
capture_interval = 100
capture_dir = "viz_data"

[env]
num_envs = 56
rom_path = "./pokemon_red.gb"
state_path = "pokered/states/bulba_start"
headless = True
frameskip = 24
press_frames = 8
max_episode_length = 20480
full_reset = True
disable_wild_until_badge = False
verbose = False
omp_threads = 4
heatmap_decay = 0.05
stream_enabled = True
stream_interval = 400
stream_user = leanke
stream_color = #882222
stream_extra = ""

[train]
total_timesteps = 1_000_000_000
update_epochs = 3
bptt_horizon = 128
compile = False
compile_mode = reduce-overhead
compile_fullgraph = False
anneal_lr = True
device = cuda

gamma = 0.996
learning_rate = 0.0014073
max_minibatch_size = 32768
minibatch_size = 4096
optimizer = muon
precision = float32

adam_beta1 = 0.9562162369235768
adam_beta2 = 0.9985481830898764
adam_eps = 0.00000177221688560271
clip_coef = 0.2
ent_coef = 0.04
gae_lambda = 0.92
max_grad_norm = 0.8229705929037459
prio_alpha = 0.7710711644328326
prio_beta0 = 0.9411894352769828
vf_clip_coef = 0.5
vf_coef = 3.095843847555002
vtrace_c_clip = 1.0266069962245616
vtrace_rho_clip = 1.7049230821842278

[sweep]
method = Protein
metric = episode_return
goal = maximize
downsample = 10

[sweep.env.num_envs]
distribution = int_uniform
min = 8
mean = 16
max = 24

